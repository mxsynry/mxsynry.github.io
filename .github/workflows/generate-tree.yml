name: Generate Repository File Tree

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tree.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tree.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");

            const ignoredItems = new Set([
              ".git",
              ".github",
              "tree.json"
            ]);

            function buildTree(dirPath, currentRelPath = "") {
              const items = fs
                .readdirSync(dirPath)
                .filter(item => !ignoredItems.has(item))
                .sort((a, b) => a.localeCompare(b));

              const children = [];

              for (const item of items) {
                const fullPath = path.join(dirPath, item);
                const relPath = currentRelPath ? `${currentRelPath}/${item}` : item;
                const stat = fs.statSync(fullPath);

                if (stat.isDirectory()) {
                  children.push({
                    name: item,
                    path: relPath,
                    type: "dir",
                    children: buildTree(fullPath, relPath)
                  });
                } else {
                  const escapedPath = relPath
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/");

                  children.push({
                    name: item,
                    path: relPath,
                    type: "file",
                    size: stat.size,
                    download_url: `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/${escapedPath}`,
                    html_url: `https://github.com/${repoOwner}/${repoName}/blob/${branch}/${escapedPath}`
                  });
                }
              }

              return children;
            }

            const treeRoot = {
              name: repoName,
              path: "",
              type: "dir",
              children: buildTree(process.cwd())
            };

            // Force rewrite every run
            if (fs.existsSync("tree.json")) {
              fs.rmSync("tree.json");
            }

            fs.writeFileSync("tree.json", JSON.stringify(treeRoot, null, 2) + "\n");

      - name: Commit and Push tree.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add tree.json

          if git diff --cached --quiet; then
            echo "tree.json is already up to date."
            exit 0
          fi

          git commit -m "chore: rebuild file tree index [skip ci]"
          git pull --rebase origin main
          git push