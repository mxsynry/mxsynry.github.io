<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="description" content="Browse site files and preview assets." />
    <link rel="icon" href="./Others/Synchrose/globe.ico" type="image/x-icon" />
    <title>Site files</title>
    <link rel="stylesheet" href="assets/css/browser.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="logo" aria-hidden="true">
          <img src="./Others/Synchrose/globe.ico" alt="Synchrose" />
        </div>
        <div class="title-wrap">
          <div class="title-row">
            <h1><span id="siteHostLabel">Site files</span></h1>
            <span class="badge" id="fileCountBadge">0 files</span>
            <span class="badge" id="currentModeBadge">HTML opens: Site</span>
          </div>
          <p class="subtitle">Browse files, preview assets, open pages.</p>
        </div>
        <div class="header-actions">
          <a
            class="btn ghost"
            href="https://github.com/mxsynry/mxsynry.github.io"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <a class="btn primary" href="/" target="_blank" rel="noopener"
            >Live Site</a
          >
        </div>
      </header>

      <div class="toolbar">
        <div class="search-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input
            type="text"
            id="search"
            placeholder="Search files or paths..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="toolbar-actions">
          <div class="segment" aria-label="View mode">
            <button id="btnGrid" class="active" type="button">Grid</button>
            <button id="btnList" type="button">List</button>
          </div>
          <label class="select-wrap"
            >Open HTML
            <select
              class="select"
              id="htmlOpenMode"
              title="What happens when you click an HTML file"
            >
              <option value="pages">Current site path</option>
              <option value="preview">Preview code here</option>
              <option value="github">GitHub file page</option>
              <option value="raw">Raw file</option>
            </select>
          </label>
          <button class="btn ghost" id="btnExpandAll" type="button">
            Expand
          </button>
          <button class="btn ghost" id="btnCollapseAll" type="button">
            Collapse
          </button>
          <button class="btn primary" id="btnRefresh" type="button">
            Refresh
          </button>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-top">Files</div>
          <div id="tree"></div>
        </aside>
        <main class="content">
          <div class="breadcrumb" id="breadcrumb">Home</div>
          <div class="main" id="main"></div>
        </main>
      </div>
    </div>

    <div
      class="preview-overlay"
      id="previewOverlay"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div class="preview-box">
        <div class="preview-header">
          <span class="title" id="previewTitle">Preview</span>
          <button
            class="close"
            id="previewClose"
            type="button"
            aria-label="Close preview"
          >
            &times;
          </button>
        </div>
        <div class="preview-body" id="previewBody"></div>
        <div class="preview-actions" id="previewActions"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script type="module" src="assets/js/browser/app.js"></script>
  </body>
</html>
