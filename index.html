<title>mxsynry.github.io — Repo Browser</title>
<style>
:root {
  --bg: #0d1117;
  --bg-elev: #161b22;
  --bg-elev2: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79b8ff;
  --dir: #e3b341;
  --file: #a5d6ff;
  --code: #7ee787;
  --media: #f778ba;
  --archive: #d2a8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}
header h1 {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}
header a { color: var(--accent); text-decoration: none; }
header a:hover { text-decoration: underline; }
.badge {
  background: var(--bg-elev2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 10px;
  font-size: 12px;
  color: var(--text-dim);
}
.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex-shrink: 0;
}
.toolbar input {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  color: var(--text);
  font-size: 14px;
  min-width: 220px;
  outline: none;
}
.toolbar input:focus { border-color: var(--accent); }
.toolbar button {
  background: var(--bg-elev2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s;
}
.toolbar button:hover { background: var(--border); }
.toolbar button.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.sidebar {
  width: 260px;
  min-width: 200px;
  max-width: 400px;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px 0;
  resize: horizontal;
}
.sidebar::-webkit-resizer { background: var(--border); }
.tree-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
  border-radius: 4px;
  margin: 0 6px;
  white-space: nowrap;
  overflow: hidden;
}
.tree-item:hover { background: var(--bg-elev2); }
.tree-toggle {
  width: 14px;
  text-align: center;
  font-size: 10px;
  color: var(--text-dim);
  cursor: pointer;
  flex-shrink: 0;
}
.tree-spacer { width: 14px; flex-shrink: 0; }
.tree-icon { font-size: 14px; flex-shrink: 0; }
.tree-label {
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-label.active { color: var(--accent); font-weight: 600; }
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.breadcrumb {
  padding: 10px 20px;
  font-size: 14px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
.breadcrumb .bc-root, .breadcrumb .bc-part {
  cursor: pointer;
  color: var(--accent);
}
.breadcrumb .bc-root:hover, .breadcrumb .bc-part:hover { text-decoration: underline; }
.breadcrumb .bc-sep { margin: 0 6px; color: var(--text-dim); }
.breadcrumb .bc-current { color: var(--text); font-weight: 500; }
.main {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px 30px;
}
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.file-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: 16px;
  background: var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.file-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--bg-elev);
  cursor: pointer;
  transition: background 0.1s;
}
.file-row:hover { background: var(--bg-elev2); }
.file-row .icon { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }
.file-row .name { flex: 1; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .size { font-size: 12px; color: var(--text-dim); flex-shrink: 0; min-width: 70px; text-align: right; }
.file-row .actions { display: flex; gap: 8px; opacity: 0; transition: opacity 0.15s; }
.file-row:hover .actions { opacity: 1; }
.file-row .actions a {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg-elev2);
  border: 1px solid var(--border);
}
.file-row .actions a:hover { background: var(--border); }
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: transform 0.1s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .icon { font-size: 28px; text-align: center; margin-bottom: 4px; }
.card .name { font-size: 14px; font-weight: 500; color: var(--text); word-break: break-all; }
.card .meta { font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; }
.card .actions { display: flex; gap: 6px; margin-top: 4px; }
.card .actions a {
  flex: 1;
  text-align: center;
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  padding: 4px;
  border-radius: 4px;
  background: var(--bg-elev2);
  border: 1px solid var(--border);
}
.card .actions a:hover { background: var(--border); }
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-size: 15px;
}
.preview-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
}
.preview-overlay.active { display: flex; }
.preview-box {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 90vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: 100%;
}
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev2);
}
.preview-header .title { font-size: 14px; font-weight: 500; }
.preview-header .close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
  padding: 0 4px;
}
.preview-header .close:hover { color: var(--text); }
.preview-body {
  flex: 1;
  overflow: auto;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100px;
}
.preview-body img, .preview-body video { max-width: 100%; max-height: 70vh; border-radius: 6px; }
.preview-body pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  font-size: 13px;
  line-height: 1.5;
  overflow: auto;
  max-width: 80vw;
  max-height: 70vh;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.preview-actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-elev2);
}
.preview-actions a, .preview-actions button {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  font-weight: 500;
}
.preview-actions button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
@media (max-width: 768px) {
  .sidebar { display: none; }
}
</style>

let viewMode = 'grid';
let currentPath = '';
let searchQuery = '';
let expandedDirs = new Set();

function formatSize(bytes) {
  if (bytes == null) return '';
  const units = ['B','KB','MB','GB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function getIcon(node) {
  if (node.type === 'dir') return { char: '\u{1F4C1}', color: 'var(--dir)' };
  const ext = (node.name.split('.').pop() || '').toLowerCase();
  const map = {
    html: { char: '\u{1F310}', color: 'var(--accent)' },
    htm:  { char: '\u{1F310}', color: 'var(--accent)' },
    css:  { char: '\u{1F3A8}', color: 'var(--accent)' },
    scss: { char: '\u{1F3A8}', color: 'var(--accent)' },
    js:   { char: '\u{1F4DD}', color: 'var(--code)' },
    ts:   { char: '\u{1F4DD}', color: 'var(--code)' },
    lua:  { char: '\u{1F4DD}', color: 'var(--code)' },
    luau: { char: '\u{1F4DD}', color: 'var(--code)' },
    md:   { char: '\u{1F4C4}', color: 'var(--text)' },
    yml:  { char: '\u{2699}\uFE0F', color: 'var(--text-dim)' },
    yaml: { char: '\u{2699}\uFE0F', color: 'var(--text-dim)' },
    json: { char: '\u{1F4E6}', color: 'var(--text-dim)' },
    mp4:  { char: '\u{1F3AC}', color: 'var(--media)' },
    png:  { char: '\u{1F5BC}\uFE0F', color: 'var(--media)' },
    jpg:  { char: '\u{1F5BC}\uFE0F', color: 'var(--media)' },
    jpeg: { char: '\u{1F5BC}\uFE0F', color: 'var(--media)' },
    gif:  { char: '\u{1F5BC}\uFE0F', color: 'var(--media)' },
    ico:  { char: '\u{1F5BC}\uFE0F', color: 'var(--media)' },
    rar:  { char: '\u{1F4E6}', color: 'var(--archive)' },
    zip:  { char: '\u{1F4E6}', color: 'var(--archive)' },
    tar:  { char: '\u{1F4E6}', color: 'var(--archive)' },
    gz:   { char: '\u{1F4E6}', color: 'var(--archive)' },
    rb:   { char: '\u{1F4DD}', color: 'var(--code)' },
    gemfile:{ char: '\u{1F48E}', color: 'var(--text-dim)' }
  };
  if (node.name.toLowerCase() === 'gemfile') return map.gemfile;
  return map[ext] || { char: '\u{1F4C4}', color: 'var(--text)' };
}

function findNode(path) {
  if (!path) return SNAPSHOT;
  const parts = path.split('/').filter(Boolean);
  let node = SNAPSHOT;
  for (const part of parts) {
    if (!node.children) return null;
    node = node.children.find(c => c.name === part);
    if (!node) return null;
  }
  return node;
}

function getAllFiles(node, prefix) {
  const files = [];
  if (!node.children) return files;
  for (const child of node.children) {
    const p = prefix ? prefix + '/' + child.name : child.name;
    if (child.type === 'dir') {
      files.push(...getAllFiles(child, p));
    } else {
      files.push({ ...child, fullPath: p });
    }
  }
  return files;
}

function countFiles(node) {
  if (node.type === 'file') return 1;
  if (!node.children) return 0;
  return node.children.reduce((sum, c) => sum + countFiles(c), 0);
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildTreeHTML(node, path, level) {
  if (!node.children) return '';
  let html = '';
  const sorted = [...node.children].sort((a, b) => {
    if (a.type === b.type) return a.name.localeCompare(b.name);
    return a.type === 'dir' ? -1 : 1;
  });
  for (const child of sorted) {
    const childPath = path ? path + '/' + child.name : child.name;
    const isDir = child.type === 'dir';
    const icon = getIcon(child);
    const isExpanded = expandedDirs.has(childPath);
    const isActive = currentPath === childPath || (currentPath && currentPath.startsWith(childPath + '/'));
    const indent = level * 16;

    html += '<div class="tree-item" data-path="' + escapeHtml(childPath) + '" data-type="' + child.type + '" style="padding-left:' + (indent + 8) + 'px" title="' + escapeHtml(child.name) + '">';
    if (isDir) {
      html += '<span class="tree-toggle" data-path="' + escapeHtml(childPath) + '">' + (isExpanded ? '\u25BC' : '\u25B6') + '</span>';
    } else {
      html += '<span class="tree-spacer"></span>';
    }
    html += '<span class="tree-icon" style="color:' + icon.color + '">' + icon.char + '</span>';
    html += '<span class="tree-label' + (isActive ? ' active' : '') + '">' + escapeHtml(child.name) + '</span>';
    html += '</div>';

    if (isDir && isExpanded) {
      html += buildTreeHTML(child, childPath, level + 1);
    }
  }
  return html;
}

function render() {
  const main = document.getElementById('main');
  const breadcrumb = document.getElementById('breadcrumb');
  const badge = document.getElementById('fileCountBadge');
  const treeEl = document.getElementById('tree');

  // Render tree sidebar
  treeEl.innerHTML = buildTreeHTML(SNAPSHOT, '', 0);

  // Bind tree clicks
  treeEl.querySelectorAll('.tree-item').forEach(el => {
    el.addEventListener('click', (e) => {
      const path = el.dataset.path;
      const type = el.dataset.type;
      if (type === 'dir') {
        if (e.target.classList.contains('tree-toggle')) {
          e.stopPropagation();
          if (expandedDirs.has(path)) {
            expandedDirs.delete(path);
          } else {
            expandedDirs.add(path);
          }
          render();
        } else {
          navigateTo(path);
        }
      } else {
        const node = findNode(path);
        if (node) previewFile(node);
      }
    });
  });

  // Update breadcrumb
  const parts = currentPath ? currentPath.split('/').filter(Boolean) : [];
  let bcHtml = '<span class="bc-root" data-path="">mxsynry.github.io</span>';
  let acc = '';
  for (let i = 0; i < parts.length; i++) {
    acc = acc ? acc + '/' + parts[i] : parts[i];
    bcHtml += '<span class="bc-sep">/</span>';
    if (i === parts.length - 1) {
      bcHtml += '<span class="bc-current">' + escapeHtml(parts[i]) + '</span>';
    } else {
      bcHtml += '<span class="bc-part" data-path="' + escapeHtml(acc) + '">' + escapeHtml(parts[i]) + '</span>';
    }
  }
  breadcrumb.innerHTML = bcHtml;

  // Bind breadcrumb clicks
  breadcrumb.querySelectorAll('.bc-root, .bc-part').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.dataset.path || ''));
  });

  // Get items to show
  let items = [];
  if (searchQuery) {
    const all = getAllFiles(SNAPSHOT, '');
    const q = searchQuery.toLowerCase();
    items = all.filter(f => f.name.toLowerCase().includes(q) || f.fullPath.toLowerCase().includes(q));
    items.sort((a, b) => a.fullPath.localeCompare(b.fullPath));
  } else {
    const node = findNode(currentPath) || SNAPSHOT;
    items = node.children || [];
    items = [...items].sort((a, b) => {
      if (a.type === b.type) return a.name.localeCompare(b.name);
      return a.type === 'dir' ? -1 : 1;
    });
  }

  badge.textContent = countFiles(SNAPSHOT) + ' files';

  if (items.length === 0) {
    main.innerHTML = '<div class="empty">No files found.</div>';
    return;
  }

  if (viewMode === 'grid') {
    main.innerHTML = '<div class="file-grid" id="fileGrid"></div>';
    const grid = document.getElementById('fileGrid');
    for (const item of items) {
      const icon = getIcon(item);
      const isDir = item.type === 'dir';
      const path = searchQuery ? item.fullPath : (currentPath ? currentPath + '/' + item.name : item.name);
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.path = path;
      card.dataset.type = item.type;
      card.innerHTML = '<div class="icon" style="color:' + icon.color + '">' + icon.char + '</div>' +
        '<div class="name" title="' + escapeHtml(item.name) + '">' + escapeHtml(item.name) + '</div>' +
        '<div class="meta"><span>' + (isDir ? (item.children ? item.children.length + ' items' : 'dir') : formatSize(item.size)) + '</span>' +
        '<span>' + (isDir ? 'folder' : (item.name.split('.').pop() || 'file')) + '</span></div>' +
        '<div class="actions">' +
        (isDir ? '<a class="btn-open">Open</a>' : '<a class="btn-dl" href="' + escapeHtml(item.download_url) + '" target="_blank" download>Download</a>') +
        '<a class="btn-gh" href="' + escapeHtml(item.html_url) + '" target="_blank">GitHub</a></div>';
      card.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') return;
        if (isDir) { navigateTo(path); } else { previewFile(item); }
      });
      grid.appendChild(card);
    }
  } else {
    main.innerHTML = '<div class="file-list" id="fileList"></div>';
    const list = document.getElementById('fileList');
    for (const item of items) {
      const icon = getIcon(item);
      const isDir = item.type === 'dir';
      const path = searchQuery ? item.fullPath : (currentPath ? currentPath + '/' + item.name : item.name);
      const row = document.createElement('div');
      row.className = 'file-row';
      row.dataset.path = path;
      row.dataset.type = item.type;
      row.innerHTML = '<span class="icon" style="color:' + icon.color + '">' + icon.char + '</span>' +
        '<span class="name" title="' + escapeHtml(item.name) + '">' + escapeHtml(item.name) + '</span>' +
        '<span class="size">' + (isDir ? '' : formatSize(item.size)) + '</span>' +
        '<div class="actions">' +
        (isDir ? '<a class="btn-open">Open</a>' : '<a class="btn-dl" href="' + escapeHtml(item.download_url) + '" target="_blank" download>Download</a>') +
        '<a class="btn-gh" href="' + escapeHtml(item.html_url) + '" target="_blank">GitHub</a></div>';
      row.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') return;
        if (isDir) { navigateTo(path); } else { previewFile(item); }
      });
      list.appendChild(row);
    }
  }
}

function navigateTo(path) {
  currentPath = path;
  searchQuery = '';
  document.getElementById('search').value = '';
  if (path) {
    const parts = path.split('/').filter(Boolean);
    let acc = '';
    for (const part of parts) {
      acc = acc ? acc + '/' + part : part;
      expandedDirs.add(acc);
    }
  }
  render();
}

function previewFile(item) {
  const overlay = document.getElementById('previewOverlay');
  const title = document.getElementById('previewTitle');
  const body = document.getElementById('previewBody');
  const actions = document.getElementById('previewActions');

  title.textContent = item.name;
  body.innerHTML = '<div style="color:var(--text-dim);padding:40px;">Loading...</div>';
  actions.innerHTML = '<a href="' + escapeHtml(item.download_url) + '" target="_blank" download>Download</a>' +
    '<a href="' + escapeHtml(item.html_url) + '" target="_blank">View on GitHub</a>' +
    '<button id="previewCloseBtn">Close</button>';
  overlay.classList.add('active');

  document.getElementById('previewCloseBtn').onclick = () => overlay.classList.remove('active');

  const ext = (item.name.split('.').pop() || '').toLowerCase();
  const isImage = ['png','jpg','jpeg','gif','ico','webp','svg'].includes(ext);
  const isVideo = ['mp4','webm','mov'].includes(ext);
  const isText = ['html','htm','css','js','ts','lua','luau','md','json','yml','yaml','txt','rb','gemfile'].includes(ext) || (item.size && item.size < 500000);

  if (isImage) {
    body.innerHTML = '<img src="' + escapeHtml(item.download_url) + '" alt="' + escapeHtml(item.name) + '">';
  } else if (isVideo) {
    body.innerHTML = '<video controls src="' + escapeHtml(item.download_url) + '"></video>';
  } else if (isText) {
    fetch(item.download_url)
      .then(r => r.text())
      .then(text => {
        body.innerHTML = '<pre>' + escapeHtml(text) + '</pre>';
      })
      .catch(() => {
        body.innerHTML = '<div style="color:var(--text-dim)">Could not load preview.</div>';
      });
  } else {
    body.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:40px;">Preview not available for this file type.<br><br><a href="' + escapeHtml(item.download_url) + '" target="_blank" download style="color:var(--accent)">Download instead</a></div>';
  }
}

// Event listeners
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById('btnGrid').addEventListener('click', () => {
  viewMode = 'grid';
  document.getElementById('btnGrid').classList.add('active');
  document.getElementById('btnList').classList.remove('active');
  render();
});

document.getElementById('btnList').addEventListener('click', () => {
  viewMode = 'list';
  document.getElementById('btnList').classList.add('active');
  document.getElementById('btnGrid').classList.remove('active');
  render();
});

document.getElementById('btnExpandAll').addEventListener('click', () => {
  function collectDirs(node, prefix) {
    if (!node.children) return;
    for (const child of node.children) {
      if (child.type === 'dir') {
        const p = prefix ? prefix + '/' + child.name : child.name;
        expandedDirs.add(p);
        collectDirs(child, p);
      }
    }
  }
  collectDirs(SNAPSHOT, '');
  render();
});

document.getElementById('btnCollapseAll').addEventListener('click', () => {
  expandedDirs.clear();
  render();
});

document.getElementById('btnRefresh').addEventListener('click', () => {
  location.reload();
});

document.getElementById('previewClose').addEventListener('click', () => {
  document.getElementById('previewOverlay').classList.remove('active');
});

document.getElementById('previewOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('previewOverlay')) {
    document.getElementById('previewOverlay').classList.remove('active');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('previewOverlay').classList.remove('active');
  }
});

render();
</script>
