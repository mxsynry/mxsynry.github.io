name: Update README Page Index

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "tree.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate pages section in README.md
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime, timezone
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/")

          if repo_name.lower() == f"{owner.lower()}.github.io":
              base_url = f"https://{owner}.github.io"
          else:
              base_url = f"https://{owner}.github.io/{repo_name}"

          ignored_dirs = {
              ".git",
              ".github",
              "node_modules",
              "dist",
              "build",
              ".next",
              ".vercel",
              ".cloudflare",
              "workers",
          }

          ignored_files = {
              "README.md",
              "tree.json",
          }

          def encode_url_path(path_text):
              return "/".join(quote(part) for part in path_text.split("/"))

          html_files = []

          for path in Path(".").rglob("*.html"):
              if any(part in ignored_dirs for part in path.parts):
                  continue

              if path.name in ignored_files:
                  continue

              html_files.append(path)

          html_files = sorted(html_files, key=lambda p: str(p).lower())

          section = []
          section.append("<!-- pages-index:start -->")
          section.append("")
          section.append("## Site Pages")
          section.append("")
          section.append("| Page | File | URL |")
          section.append("|---|---|---|")

          if not html_files:
              section.append("| No HTML pages found | — | — |")
          else:
              for path in html_files:
                  rel = path.as_posix()

                  if path.name.lower() == "index.html":
                      folder = path.parent.as_posix()

                      if folder == ".":
                          label = "Home"
                          url = f"{base_url}/"
                      else:
                          label = folder
                          encoded_folder = encode_url_path(folder)
                          url = f"{base_url}/{encoded_folder}/"
                  else:
                      label = rel
                      encoded_rel = encode_url_path(rel)
                      url = f"{base_url}/{encoded_rel}"

                  section.append(f"| [{label}]({url}) | `{rel}` | {url} |")

          section.append("")
          section.append(f"_Last generated: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}_")
          section.append("")
          section.append("<!-- pages-index:end -->")
          section.append("")

          new_section = "\n".join(section)

          readme_path = Path("README.md")

          if readme_path.exists():
              old = readme_path.read_text(encoding="utf-8")
          else:
              old = "# mxsynry.github.io\n\n"

          start = "<!-- pages-index:start -->"
          end = "<!-- pages-index:end -->"

          if start in old and end in old:
              before = old.split(start)[0].rstrip()
              after = old.split(end, 1)[1].lstrip()
              final = before + "\n\n" + new_section + "\n" + after
          else:
              final = old.rstrip() + "\n\n" + new_section + "\n"

          readme_path.write_text(final, encoding="utf-8")
          PY

      - name: Commit README.md if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi

          git commit -m "Update README page index [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}