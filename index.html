<style>
:root {
  --bg: #08080d;
  --bg-soft: #0d0d16;
  --surface: rgba(18, 18, 29, 0.82);
  --surface-strong: #141421;
  --surface-hover: #1d1d2f;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(168,85,247,0.38);
  --text: #f2f0ff;
  --text-muted: #a7a3bd;
  --text-dim: #77728f;
  --purple: #7c3aed;
  --purple-2: #a855f7;
  --pink: #ec4899;
  --blue: #38bdf8;
  --green: #34d399;
  --yellow: #facc15;
  --danger: #fb7185;
  --dir: #fbbf24;
  --file: #93c5fd;
  --code: #86efac;
  --media: #f9a8d4;
  --archive: #c4b5fd;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 24px 70px rgba(0,0,0,0.42);
  --gradient: linear-gradient(135deg, var(--purple) 0%, var(--purple-2) 45%, var(--pink) 100%);
  --gradient-soft: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(236,72,153,0.14));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.48) var(--bg); }
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--text);
  background:
    radial-gradient(circle at 12% -8%, rgba(124,58,237,0.35), transparent 30%),
    radial-gradient(circle at 88% 5%, rgba(236,72,153,0.24), transparent 30%),
    radial-gradient(circle at 60% 110%, rgba(56,189,248,0.12), transparent 26%),
    var(--bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.36); border-radius: 999px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: rgba(236,72,153,0.56); }
a { color: inherit; }
button, select, input { font: inherit; }
.app-shell { height: 100vh; display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
.header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,8,13,0.82);
  backdrop-filter: blur(20px);
}
.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--gradient);
  box-shadow: 0 0 26px rgba(124,58,237,0.28), 0 0 32px rgba(236,72,153,0.12);
  flex-shrink: 0;
}
.logo img { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,255,255,0.25)); }
.title-wrap { min-width: 0; flex: 1; }
.title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.title-row h1 {
  font-size: clamp(18px, 2vw, 24px);
  letter-spacing: -0.035em;
  line-height: 1.1;
}
.title-row h1 span {
  background: var(--gradient);

  -webkit-text-fill-color: transparent;
}
.subtitle { margin-top: 4px; color: var(--text-muted); font-size: 13px; }
.badge {

  color: var(--text-muted);

}
.header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn, .mini-btn, .select {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.045);
  color: var(--text);
  border-radius: 999px;
  padding: 10px 14px;

  transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;

  gap: 8px;

}
.btn:hover, .mini-btn:hover, .select:hover { border-color: rgba(236,72,153,0.45); background: rgba(255,255,255,0.075); box-shadow: 0 0 22px rgba(124,58,237,0.13); }
.btn:active, .mini-btn:active { transform: translateY(1px); }
.btn.primary, .mini-btn.primary { background: var(--gradient); border-color: transparent; color: #fff; font-weight: 750; box-shadow: 0 12px 28px rgba(124,58,237,0.24); }
.btn.ghost { color: var(--text-muted); }
.mini-btn { padding: 7px 10px; border-radius: 12px; font-size: 12px; }
.mini-btn.primary { color: white !important; }
.toolbar {
  z-index: 15;
  display: grid;
  grid-template-columns: minmax(240px, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,8,13,0.64);
  backdrop-filter: blur(18px);
}
.search-wrap { position: relative; min-width: 0; }
.search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-dim); pointer-events: none; }
.search-wrap input {
  width: 100%;
  border: 1px solid rgba(168,85,247,0.34);
  background: linear-gradient(180deg, rgba(22,22,36,0.92), rgba(13,13,22,0.92));

.search-wrap input:focus { border-color: rgba(236,72,153,0.65); box-shadow: 0 0 0 4px rgba(124,58,237,0.14), 0 0 28px rgba(236,72,153,0.12); }
.toolbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.segment {
  display: inline-flex;
  gap: 4px;
  padding: 4px;

}
.segment button {
  background: transparent;
  border: 0;

  padding: 8px 12px;

}
.segment button.active { color: #fff; background: var(--gradient); font-weight: 750; }
.select-wrap { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
.select {

  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;

}
.layout { display: grid; grid-template-columns: minmax(230px, 300px) 1fr; min-height: 0; overflow: hidden; }
.sidebar {
  border-right: 1px solid var(--border);
  background: rgba(15,15,26,0.74);
  backdrop-filter: blur(18px);
  overflow: auto;
  padding: 12px 10px 24px;
  resize: horizontal;

  max-width: 420px;
}
.sidebar-top { padding: 10px 10px 12px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
.tree-item {
  display: flex;

}
.tree-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.tree-toggle, .tree-spacer { width: 16px; flex: 0 0 16px; text-align: center; font-size: 10px; color: var(--text-dim); }
.tree-icon { width: 20px; flex: 0 0 20px; text-align: center; }
.tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-label.active { color: #fff; font-weight: 800; text-shadow: 0 0 14px rgba(236,72,153,0.18); }
.content { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.breadcrumb {
  padding: 13px 22px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: rgba(8,8,13,0.34);
  font-size: 13px;
  overflow-x: auto;
  white-space: nowrap;
}
.breadcrumb .bc-root, .breadcrumb .bc-part { cursor: pointer; color: #d8b4fe; }
.breadcrumb .bc-root:hover, .breadcrumb .bc-part:hover { color: #f0abfc; }
.breadcrumb .bc-sep { margin: 0 8px; color: var(--text-dim); }
.breadcrumb .bc-current { color: var(--text); font-weight: 750; }
.main { flex: 1; min-height: 0; overflow: auto; padding: 22px; }
.path-note {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--gradient-soft);
  color: var(--text-muted);
}
.path-note strong { color: var(--text); }
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 16px; }
.file-list { display: flex; flex-direction: column; gap: 8px; }
.card, .file-row {
  border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(24,24,39,0.88), rgba(14,14,23,0.88));
  box-shadow: 0 16px 34px rgba(0,0,0,0.22);
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 3px;
  background: var(--gradient);
  opacity: 0;
  transition: opacity .18s ease;
}
.card:hover, .file-row:hover { transform: translateY(-2px); border-color: rgba(236,72,153,0.42); box-shadow: 0 20px 48px rgba(0,0,0,0.30), 0 0 26px rgba(124,58,237,0.12); }
.card:hover::before { opacity: 1; }
.card .icon { font-size: 30px; line-height: 1; }
.card .name { font-weight: 800; line-height: 1.25; word-break: break-word; color: var(--text); }
.card .path { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--text-muted); font-size: 12px; }
.card .actions, .file-row .actions { display: flex; gap: 7px; flex-wrap: wrap; }
.card .actions { margin-top: auto; }
.file-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto auto;
  gap: 12px;
  align-items: center;
  padding: 13px 14px;
  border-radius: 14px;
  cursor: pointer;
}
.file-row .icon { font-size: 20px; text-align: center; }
.file-row .name { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .subpath { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.file-row .size { color: var(--text-muted); font-size: 12px; min-width: 70px; text-align: right; }
.empty {
  min-height: 280px;
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--text-muted);
  border: 1px dashed rgba(168,85,247,0.28);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.03);
  padding: 40px;
}
.preview-overlay {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(10px);
  z-index: 100;
  padding: 24px;
}
.preview-overlay.active { display: grid; }
.preview-box {
  width: min(1100px, 94vw);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 22px;
  border: 1px solid rgba(168,85,247,0.3);
  background: rgba(17,17,28,0.98);
  box-shadow: var(--shadow);
}
.preview-header, .preview-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.045);
  border-bottom: 1px solid var(--border);
}
.preview-actions { border-bottom: 0; border-top: 1px solid var(--border); justify-content: flex-start; flex-wrap: wrap; }
.preview-header .title { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview-header .close { background: transparent; border: 0; color: var(--text-muted); font-size: 24px; cursor: pointer; }
.preview-header .close:hover { color: var(--text); }
.preview-body { flex: 1; overflow: auto; padding: 18px; min-height: 180px; display: grid; place-items: center; }
.preview-body img, .preview-body video { max-width: 100%; max-height: 70vh; border-radius: 14px; }
.preview-body pre {
  justify-self: stretch;
  align-self: stretch;
  background: #07070b;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  color: #e6edf3;
  font-size: 13px;
  line-height: 1.55;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.loading { color: var(--text-muted); padding: 40px; }
.toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 200;
  padding: 13px 16px;
  border-radius: 14px;
  border: 1px solid rgba(168,85,247,0.3);
  background: rgba(17,17,28,0.96);
  color: var(--text);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }
@media (max-width: 900px) {
  body { overflow: auto; }
  .app-shell { height: auto; min-height: 100vh; display: flex; flex-direction: column; }
  .toolbar { grid-template-columns: 1fr; }
  .toolbar-actions { justify-content: flex-start; }
  .layout { grid-template-columns: 1fr; overflow: visible; }
  .sidebar { display: none; }
  .main { overflow: visible; }
  .file-row { grid-template-columns: 28px minmax(0, 1fr); }
  .file-row .size, .file-row .actions { grid-column: 2; text-align: left; }
  .header { align-items: flex-start; }
  .header-actions { display: none; }
}
</style>

<script>
const CONFIG = {
  owner: 'mxsynry',
  repo: 'mxsynry.github.io',
  branch: 'main',
  pagesOrigin: 'https://mxsynry.github.io'
};

let SNAPSHOT = null;
let viewMode = localStorage.getItem('mxsynry:viewMode') || localStorage.getItem('repoBrowser:viewMode') || 'grid';
let currentPath = '';
let searchQuery = '';
let expandedDirs = new Set();
let htmlOpenMode = localStorage.getItem('mxsynry:htmlOpenMode') || localStorage.getItem('repoBrowser:htmlOpenMode') || 'pages';

function formatSize(bytes) {
  if (bytes == null) return '';
  const units = ['B','KB','MB','GB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

function extOf(name = '') { return (String(name).split('.').pop() || '').toLowerCase(); }
function isHtmlFile(node) { return node && node.type !== 'dir' && ['html','htm'].includes(extOf(node.name)); }
function encodePath(path = '') { return path.split('/').filter(Boolean).map(encodeURIComponent).join('/'); }
function getPagesUrl(path = '') { return CONFIG.pagesOrigin.replace(/\/$/, '') + '/' + encodePath(path); }
function getGitHubUrl(path = '', type = 'file') {
  const kind = type === 'dir' ? 'tree' : 'blob';
  return `https://github.com/${CONFIG.owner}/${CONFIG.repo}/${kind}/${CONFIG.branch}/${encodePath(path)}`;
}
function getRawUrl(path = '') {
  return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${encodePath(path)}`;
}

function getIcon(node) {
  if (node.type === 'dir') return { char: '📁', color: 'var(--dir)' };
  const ext = extOf(node.name);
  const map = {
    html: { char: '🌐', color: 'var(--pink)' }, htm: { char: '🌐', color: 'var(--pink)' },
    css: { char: '🎨', color: 'var(--blue)' }, scss: { char: '🎨', color: 'var(--blue)' },
    js: { char: '📜', color: 'var(--code)' }, ts: { char: '📜', color: 'var(--code)' },
    lua: { char: '📜', color: 'var(--code)' }, luau: { char: '📜', color: 'var(--code)' }, rb: { char: '📜', color: 'var(--code)' },
    md: { char: '📄', color: 'var(--text)' }, txt: { char: '📄', color: 'var(--text)' },
    yml: { char: '⚙️', color: 'var(--text-muted)' }, yaml: { char: '⚙️', color: 'var(--text-muted)' }, json: { char: '📦', color: 'var(--archive)' },
    mp4: { char: '🎬', color: 'var(--media)' }, webm: { char: '🎬', color: 'var(--media)' }, mov: { char: '🎬', color: 'var(--media)' },
    png: { char: '🖼️', color: 'var(--media)' }, jpg: { char: '🖼️', color: 'var(--media)' }, jpeg: { char: '🖼️', color: 'var(--media)' }, gif: { char: '🖼️', color: 'var(--media)' }, webp: { char: '🖼️', color: 'var(--media)' }, svg: { char: '🖼️', color: 'var(--media)' }, ico: { char: '🖼️', color: 'var(--media)' },
    rar: { char: '🗜️', color: 'var(--archive)' }, zip: { char: '🗜️', color: 'var(--archive)' }, tar: { char: '🗜️', color: 'var(--archive)' }, gz: { char: '🗜️', color: 'var(--archive)' }
  };
  if (String(node.name).toLowerCase() === 'gemfile') return { char: '💎', color: 'var(--archive)' };
  return map[ext] || { char: '📄', color: 'var(--file)' };
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2600);
}

function normalizeNode(node, parentPath = '') {
  if (!node) return null;
  const name = node.name || CONFIG.repo;
  const type = node.type === 'tree' ? 'dir' : node.type === 'blob' ? 'file' : (node.type || 'dir');
  const path = parentPath ? parentPath + '/' + name : (node.path || '');
  const normalized = {
    ...node,
    name,
    type,
    path: node.path || path,
    fullPath: node.fullPath || node.path || path,
    size: node.size,
    html_url: node.html_url,
    download_url: node.download_url
  };
  if (type === 'dir') {
    normalized.children = (node.children || []).map(child => normalizeNode(child, normalized.fullPath)).filter(Boolean);
  }
  return normalized;
}

function findNode(path) {
  if (!path) return SNAPSHOT;
  const parts = path.split('/').filter(Boolean);
  let node = SNAPSHOT;
  for (const part of parts) {
    if (!node || !node.children) return null;
    node = node.children.find(c => c.name === part);
  }
  return node || null;
}

function getAllFiles(node, prefix = '') {
  const files = [];
  if (!node || !node.children) return files;
  for (const child of node.children) {
    const p = prefix ? prefix + '/' + child.name : child.name;
    if (child.type === 'dir') files.push(...getAllFiles(child, p));
    else files.push({ ...child, fullPath: p });
  }
  return files;
}

function countFiles(node) {
  if (!node) return 0;
  if (node.type === 'file') return 1;
  return (node.children || []).reduce((sum, child) => sum + countFiles(child), 0);
}

function buildTreeHTML(node, path = '', level = 0) {
  if (!node || !node.children) return '';
  const sorted = [...node.children].sort(sortDirsFirst);
  return sorted.map(child => {
    const childPath = path ? path + '/' + child.name : child.name;
    const isDir = child.type === 'dir';
    const icon = getIcon(child);
    const isExpanded = expandedDirs.has(childPath);
    const isActive = currentPath === childPath || (currentPath && currentPath.startsWith(childPath + '/'));
    const indent = level * 16;
    let html = `<div class="tree-item" data-path="${escapeHtml(childPath)}" data-type="${child.type}" style="padding-left:${indent + 8}px" title="${escapeHtml(child.name)}">`;
    html += isDir ? `<span class="tree-toggle" data-path="${escapeHtml(childPath)}">${isExpanded ? '▼' : '▶'}</span>` : '<span class="tree-spacer"></span>';
    html += `<span class="tree-icon" style="color:${icon.color}">${icon.char}</span>`;
    html += `<span class="tree-label${isActive ? ' active' : ''}">${escapeHtml(child.name)}</span></div>`;
    if (isDir && isExpanded) html += buildTreeHTML(child, childPath, level + 1);
    return html;
  }).join('');
}

function sortDirsFirst(a, b) {
  if (a.type === b.type) return a.name.localeCompare(b.name);
  return a.type === 'dir' ? -1 : 1;
}

function actionButtons(item, path, isDir) {
  if (isDir) {
    return `<a class="mini-btn primary btn-open" href="#" data-action="open-folder">Open</a><a class="mini-btn" href="${escapeHtml(item.html_url || getGitHubUrl(path, 'dir'))}" target="_blank" rel="noopener" data-action="external">GitHub</a>`;
  }
  const raw = item.download_url || getRawUrl(path);
  const gh = item.html_url || getGitHubUrl(path, 'file');
  const site = getPagesUrl(path);
  const htmlSite = isHtmlFile(item) ? `<a class="mini-btn primary" href="${escapeHtml(site)}" target="_blank" rel="noopener" data-action="external">Site</a>` : '';
  return `${htmlSite}<a class="mini-btn" href="#" data-action="preview">Preview</a><a class="mini-btn" href="${escapeHtml(gh)}" target="_blank" rel="noopener" data-action="external">GitHub</a><a class="mini-btn" href="${escapeHtml(raw)}" target="_blank" rel="noopener" download data-action="external">Raw</a>`;
}

function render() {
  if (!SNAPSHOT) return;
  const main = document.getElementById('main');
  const breadcrumb = document.getElementById('breadcrumb');
  const badge = document.getElementById('fileCountBadge');
  const treeEl = document.getElementById('tree');
  const modeBadge = document.getElementById('currentModeBadge');

  treeEl.innerHTML = buildTreeHTML(SNAPSHOT, '', 0);
  treeEl.querySelectorAll('.tree-item').forEach(el => {
    el.addEventListener('click', e => {
      const path = el.dataset.path;
      const type = el.dataset.type;
      if (type === 'dir') {
        if (e.target.classList.contains('tree-toggle')) {
          e.stopPropagation();
          expandedDirs.has(path) ? expandedDirs.delete(path) : expandedDirs.add(path);
          render();
        } else navigateTo(path);
      } else {
        const node = findNode(path);
        if (node) handleFileOpen(node, path);
      }
    });
  });

  const parts = currentPath ? currentPath.split('/').filter(Boolean) : [];
  let bcHtml = '<span class="bc-root" data-path="">mxsynry.github.io</span>';
  let acc = '';
  parts.forEach((part, i) => {
    acc = acc ? acc + '/' + part : part;
    bcHtml += '<span class="bc-sep">/</span>';
    bcHtml += i === parts.length - 1 ? `<span class="bc-current">${escapeHtml(part)}</span>` : `<span class="bc-part" data-path="${escapeHtml(acc)}">${escapeHtml(part)}</span>`;
  });
  breadcrumb.innerHTML = bcHtml;
  breadcrumb.querySelectorAll('.bc-root, .bc-part').forEach(el => el.addEventListener('click', () => navigateTo(el.dataset.path || '')));

  let items;
  let noteText;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = getAllFiles(SNAPSHOT).filter(f => f.name.toLowerCase().includes(q) || f.fullPath.toLowerCase().includes(q)).sort((a, b) => a.fullPath.localeCompare(b.fullPath));
    noteText = `<strong>Search:</strong> ${escapeHtml(searchQuery)} · ${items.length} result${items.length === 1 ? '' : 's'}`;
  } else {
    const node = findNode(currentPath) || SNAPSHOT;
    items = [...(node.children || [])].sort(sortDirsFirst);
    noteText = `<strong>${escapeHtml(currentPath || 'Root')}</strong> · ${items.length} item${items.length === 1 ? '' : 's'}`;
  }

  badge.textContent = countFiles(SNAPSHOT) + ' files';
  modeBadge.textContent = 'HTML opens: ' + ({pages:'Site path', preview:'Preview', github:'GitHub', raw:'Raw'}[htmlOpenMode] || 'Site path');

  if (!items.length) {
    main.innerHTML = '<div class="empty"><div><strong>No files found.</strong><br>Try a different search term or folder.</div></div>';
    return;
  }

  const note = `<div class="path-note"><span>${noteText}</span><span>HTML files include a <strong>Site</strong> button for ${CONFIG.pagesOrigin}</span></div>`;
  if (viewMode === 'grid') renderGrid(main, items, note);
  else renderList(main, items, note);
}

function renderGrid(main, items, note) {
  main.innerHTML = note + '<div class="file-grid" id="fileGrid"></div>';
  const grid = document.getElementById('fileGrid');
  for (const item of items) {
    const isDir = item.type === 'dir';
    const path = searchQuery ? item.fullPath : (currentPath ? currentPath + '/' + item.name : item.name);
    const icon = getIcon(item);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.path = path;
    card.dataset.type = item.type;
    card.innerHTML = `
      <div class="icon" style="color:${icon.color}">${icon.char}</div>
      <div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
      <div class="path" title="${escapeHtml(path)}">${escapeHtml(path)}</div>
      <div class="meta"><span>${isDir ? ((item.children || []).length + ' items') : formatSize(item.size)}</span><span>${isDir ? 'folder' : extOf(item.name) || 'file'}</span></div>
      <div class="actions">${actionButtons(item, path, isDir)}</div>`;
    card.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      isDir ? navigateTo(path) : handleFileOpen(item, path);
    });
    card.querySelector('[data-action="preview"]')?.addEventListener('click', e => { e.preventDefault(); previewFile(item, path); });
    card.querySelector('[data-action="open-folder"]')?.addEventListener('click', e => { e.preventDefault(); navigateTo(path); });
    grid.appendChild(card);
  }
}

function renderList(main, items, note) {
  main.innerHTML = note + '<div class="file-list" id="fileList"></div>';
  const list = document.getElementById('fileList');
  for (const item of items) {
    const isDir = item.type === 'dir';
    const path = searchQuery ? item.fullPath : (currentPath ? currentPath + '/' + item.name : item.name);
    const icon = getIcon(item);
    const row = document.createElement('div');
    row.className = 'file-row';
    row.dataset.path = path;
    row.dataset.type = item.type;
    row.innerHTML = `
      <span class="icon" style="color:${icon.color}">${icon.char}</span>
      <span><span class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span><div class="subpath" title="${escapeHtml(path)}">${escapeHtml(path)}</div></span>
      <span class="size">${isDir ? ((item.children || []).length + ' items') : formatSize(item.size)}</span>
      <div class="actions">${actionButtons(item, path, isDir)}</div>`;
    row.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      isDir ? navigateTo(path) : handleFileOpen(item, path);
    });
    row.querySelector('[data-action="preview"]')?.addEventListener('click', e => { e.preventDefault(); previewFile(item, path); });
    row.querySelector('[data-action="open-folder"]')?.addEventListener('click', e => { e.preventDefault(); navigateTo(path); });
    list.appendChild(row);
  }
}

function navigateTo(path) {
  currentPath = path || '';
  searchQuery = '';
  const search = document.getElementById('search');
  if (search) search.value = '';
  if (path) {
    const parts = path.split('/').filter(Boolean);
    let acc = '';
    for (const part of parts) {
      acc = acc ? acc + '/' + part : part;
      expandedDirs.add(acc);
    }
  }
  render();
}

function handleFileOpen(item, path) {
  if (!isHtmlFile(item)) return previewFile(item, path);
  if (htmlOpenMode === 'pages') window.open(getPagesUrl(path), '_blank', 'noopener');
  else if (htmlOpenMode === 'github') window.open(item.html_url || getGitHubUrl(path, 'file'), '_blank', 'noopener');
  else if (htmlOpenMode === 'raw') window.open(item.download_url || getRawUrl(path), '_blank', 'noopener');
  else previewFile(item, path);
}

function openPreview() {
  const overlay = document.getElementById('previewOverlay');
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
}
function closePreview() {
  const overlay = document.getElementById('previewOverlay');
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
}

function previewFile(item, path) {
  const title = document.getElementById('previewTitle');
  const body = document.getElementById('previewBody');
  const actions = document.getElementById('previewActions');
  const raw = item.download_url || getRawUrl(path);
  const gh = item.html_url || getGitHubUrl(path, 'file');
  const site = getPagesUrl(path);
  title.textContent = item.name;
  body.innerHTML = '<div class="loading">Loading preview...</div>';
  actions.innerHTML = `${isHtmlFile(item) ? `<a class="mini-btn primary" href="${escapeHtml(site)}" target="_blank" rel="noopener">Open on GitHub Pages</a>` : ''}<a class="mini-btn" href="${escapeHtml(raw)}" target="_blank" rel="noopener" download>Raw / Download</a><a class="mini-btn" href="${escapeHtml(gh)}" target="_blank" rel="noopener">GitHub</a><button class="mini-btn" id="previewCloseBtn" type="button">Close</button>`;
  openPreview();
  document.getElementById('previewCloseBtn').onclick = closePreview;

  const ext = extOf(item.name);
  const isImage = ['png','jpg','jpeg','gif','ico','webp','svg'].includes(ext);
  const isVideo = ['mp4','webm','mov'].includes(ext);
  const isText = ['html','htm','css','js','ts','lua','luau','md','json','yml','yaml','txt','rb'].includes(ext) || String(item.name).toLowerCase() === 'gemfile' || (item.size && item.size < 500000);

  if (isImage) body.innerHTML = `<img src="${escapeHtml(raw)}" alt="${escapeHtml(item.name)}">`;
  else if (isVideo) body.innerHTML = `<video controls src="${escapeHtml(raw)}"></video>`;
  else if (isText) {
    fetch(raw)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => { body.innerHTML = `<pre>${escapeHtml(text)}</pre>`; })
      .catch(() => { body.innerHTML = '<div class="empty">Could not load preview.</div>'; });
  } else {
    body.innerHTML = `<div class="empty"><div><strong>Preview not available.</strong><br><br><a class="mini-btn primary" href="${escapeHtml(raw)}" target="_blank" rel="noopener" download>Download file</a></div></div>`;
  }
}

function collectDirs(node, prefix = '') {
  if (!node || !node.children) return;
  for (const child of node.children) {
    if (child.type === 'dir') {
      const p = prefix ? prefix + '/' + child.name : child.name;
      expandedDirs.add(p);
      collectDirs(child, p);
    }
  }
}

function bindUi() {
  const search = document.getElementById('search');
  const modeSelect = document.getElementById('htmlOpenMode');
  document.getElementById('btnGrid').classList.toggle('active', viewMode === 'grid');
  document.getElementById('btnList').classList.toggle('active', viewMode === 'list');
  modeSelect.value = htmlOpenMode;

  search.addEventListener('input', e => { searchQuery = e.target.value.trim(); render(); });
  search.addEventListener('keydown', e => { if (e.key === 'Escape') { search.value = ''; searchQuery = ''; render(); } });
  document.getElementById('btnGrid').addEventListener('click', () => { viewMode = 'grid'; localStorage.setItem('mxsynry:viewMode', viewMode); document.getElementById('btnGrid').classList.add('active'); document.getElementById('btnList').classList.remove('active'); render(); });
  document.getElementById('btnList').addEventListener('click', () => { viewMode = 'list'; localStorage.setItem('mxsynry:viewMode', viewMode); document.getElementById('btnList').classList.add('active'); document.getElementById('btnGrid').classList.remove('active'); render(); });
  modeSelect.addEventListener('change', e => { htmlOpenMode = e.target.value; localStorage.setItem('mxsynry:htmlOpenMode', htmlOpenMode); render(); showToast('HTML open mode: ' + modeSelect.options[modeSelect.selectedIndex].text); });
  document.getElementById('btnExpandAll').addEventListener('click', () => { collectDirs(SNAPSHOT); render(); });
  document.getElementById('btnCollapseAll').addEventListener('click', () => { expandedDirs.clear(); render(); });
  document.getElementById('btnRefresh').addEventListener('click', () => location.reload());
  document.getElementById('previewClose').addEventListener('click', closePreview);
  document.getElementById('previewOverlay').addEventListener('click', e => { if (e.target.id === 'previewOverlay') closePreview(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });
}

function buildSnapshotFromGitTree(tree) {
  const root = { name: CONFIG.repo, type: 'dir', path: '', fullPath: '', children: [] };
  const dirs = new Map([['', root]]);
  const items = [...tree].sort((a, b) => a.path.localeCompare(b.path));
  for (const item of items) {
    const parts = item.path.split('/').filter(Boolean);
    const name = parts.pop();
    const parentPath = parts.join('/');
    let parent = dirs.get(parentPath);
    if (!parent) {
      let acc = '';
      parent = root;
      for (const part of parts) {
        const nextPath = acc ? acc + '/' + part : part;
        let dir = dirs.get(nextPath);
        if (!dir) {
          dir = { name: part, type: 'dir', path: nextPath, fullPath: nextPath, children: [], html_url: getGitHubUrl(nextPath, 'dir') };
          parent.children.push(dir);
          dirs.set(nextPath, dir);
        }
        parent = dir;
        acc = nextPath;
      }
    }
    const fullPath = item.path;
    if (item.type === 'tree') {
      const dir = { name, type: 'dir', path: fullPath, fullPath, children: [], html_url: getGitHubUrl(fullPath, 'dir') };
      parent.children.push(dir);
      dirs.set(fullPath, dir);
    } else if (item.type === 'blob') {
      parent.children.push({ name, type: 'file', path: fullPath, fullPath, size: item.size, html_url: getGitHubUrl(fullPath, 'file'), download_url: getRawUrl(fullPath) });
    }
  }
  return root;
}

async function fetchSnapshot() {
  try {
    const local = await fetch('./tree.json', { cache: 'no-store' });
    if (local.ok) return normalizeNode(await local.json());
  } catch (_) {}

  const branches = [CONFIG.branch, 'master'];
  for (const branch of branches) {
    try {
      const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${branch}?recursive=1`;
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) continue;
      const data = await res.json();
      CONFIG.branch = branch;
      return buildSnapshotFromGitTree(data.tree || []);
    } catch (_) {}
  }
  throw new Error('Failed to load tree.json and GitHub API fallback.');
}

async function init() {
  bindUi();
  document.getElementById('main').innerHTML = '<div class="empty"><div><strong>Loading repository index...</strong><br>Reading tree.json, then falling back to GitHub API if needed.</div></div>';
  try {
    SNAPSHOT = await fetchSnapshot();
    render();
  } catch (error) {
    console.error(error);
    document.getElementById('main').innerHTML = `<div class="empty" style="color:var(--danger)"><div><strong>Failed to load index.</strong><br>${escapeHtml(error.message)}<br><br>Make sure <code>tree.json</code> exists beside this HTML file, or allow GitHub API access.</div></div>`;
  }
}

init();
</script>
</body>
</html>
