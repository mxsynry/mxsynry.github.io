name: Update README Page Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.html"
      - ".github/workflows/update-readme-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update generated pages section
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import os
          import re

          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/")

          if repo_name.lower() == f"{owner.lower()}.github.io":
              base_url = f"https://{owner}.github.io"
          else:
              base_url = f"https://{owner}.github.io/{repo_name}"

          ignored_dirs = {
              ".git",
              ".github",
              "node_modules",
              "dist",
              "build",
              ".next",
              ".vercel",
              ".cloudflare",
              "workers",
          }

          def encode_url_path(path_text):
              return "/".join(quote(part) for part in path_text.split("/"))

          html_files = []

          for path in Path(".").rglob("*.html"):
              if any(part in ignored_dirs for part in path.parts):
                  continue
              html_files.append(path)

          html_files = sorted(html_files, key=lambda p: str(p).lower())

          section = []
          section.append("<!-- pages-index:start -->")
          section.append("## Site Pages")
          section.append("")
          section.append("This section is automatically generated from the HTML files in this repository.")
          section.append("")
          section.append("| Page | File |")
          section.append("|---|---|")

          if not html_files:
              section.append("| No HTML pages found | — |")
          else:
              for path in html_files:
                  rel = path.as_posix()

                  if path.name.lower() == "index.html":
                      folder = path.parent.as_posix()
                      if folder == ".":
                          label = "Home"
                          url = f"{base_url}/"
                      else:
                          label = folder
                          url = f"{base_url}/{encode_url_path(folder)}/"
                  else:
                      label = rel
                      url = f"{base_url}/{encode_url_path(rel)}"

                  section.append(f"| [{label}]({url}) | `{rel}` |")

          section.append("<!-- pages-index:end -->")
          section.append("")

          new_section = "\n".join(section)

          readme_path = Path("README.md")

          if readme_path.exists():
              old = readme_path.read_text(encoding="utf-8")
          else:
              old = "# mxsynry.github.io\n\n"

          start = "<!-- pages-index:start -->"
          end = "<!-- pages-index:end -->"

          pattern = re.compile(
              r"\n*<!-- pages-index:start -->.*?<!-- pages-index:end -->\n*",
              re.DOTALL
          )

          # Remove every existing generated block, including accidental duplicates.
          cleaned = pattern.sub("\n\n", old).strip()

          # Optional cleanup for the old full-README format if it exists.
          old_auto_text = "This README is automatically generated from the HTML files in this repository."
          if cleaned.startswith("# Site Pages") and old_auto_text in cleaned:
              cleaned = "# mxsynry.github.io"

          final = cleaned.rstrip() + "\n\n" + new_section

          readme_path.write_text(final, encoding="utf-8")
          PY

      - name: Commit README.md if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi

          git commit -m "Update README page index [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
