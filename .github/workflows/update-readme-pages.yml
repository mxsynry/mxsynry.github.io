name: Update README Page Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.html"
      - ".github/workflows/update-readme-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate README.md from HTML pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import html

          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/")

          # GitHub user/organization Pages repo:
          # mxsynry.github.io -> https://mxsynry.github.io/
          if repo_name.lower() == f"{owner.lower()}.github.io":
              base_url = f"https://{owner}.github.io"
          else:
              base_url = f"https://{owner}.github.io/{repo_name}"

          ignored_dirs = {
              ".git",
              ".github",
              "node_modules",
              "dist",
              "build",
              ".next",
              ".vercel",
          }

          html_files = []
          for path in Path(".").rglob("*.html"):
              parts = set(path.parts)
              if parts & ignored_dirs:
                  continue
              html_files.append(path)

          html_files = sorted(html_files, key=lambda p: str(p).lower())

          lines = []
          lines.append("# Site Pages")
          lines.append("")
          lines.append("This README is automatically updated by GitHub Actions whenever HTML files are added, removed, or changed.")
          lines.append("")
          lines.append("## Pages")
          lines.append("")

          if not html_files:
              lines.append("_No HTML pages found._")
          else:
              for path in html_files:
                  rel = path.as_posix()

                  if path.name.lower() == "index.html":
                      page_path = path.parent.as_posix()
                      if page_path == ".":
                          url = f"{base_url}/"
                          label = "Home"
                      else:
                          url = f"{base_url}/{page_path}/"
                          label = page_path
                  else:
                      url = f"{base_url}/{rel}"
                      label = rel

                  lines.append(f"- [{label}]({url})")
                  lines.append(f"  - File: `{rel}`")

          lines.append("")
          lines.append("## Last updated")
          lines.append("")
          lines.append("Updated automatically after the latest HTML-related push.")
          lines.append("")

          Path("README.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit README.md if changed
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update README page index"
          git push