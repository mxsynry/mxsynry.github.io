<!doctype html>

<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luau Editor</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://kit-pro.fontawesome.com/releases/v6.2.0/css/pro.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <div
      class="modal fade bg-glass"
      id="addtab"
      tabindex="-1"
      aria-labelledby="addTabTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content bg-modal">
          <div class="modal-body">
            <div class="tab-dialog-form">
              <div class="col-lg-10 m-cent">
                <div class="mb-2 mt-2">
                  <div class="mb-2">
                    <label
                      id="addTabTitle"
                      for="tabname"
                      class="mb-1 text-white"
                      >Tab name</label
                    >
                    <input
                      type="text"
                      id="tabname"
                      class="form-control bg-modal"
                      value=""
                    />
                  </div>
                </div>

                <button
                  type="button"
                  class="btnm w-100 mt-2"
                  id="confirmAddTab"
                >
                  Add Tab
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-tabcon bg-black">
      <div id="tabcon" class="d-flex overflow-auto px-2"></div>
      <button class="btn_tabadd m-1" id="open_addtab" aria-label="New tab">
        +
      </button>
    </div>

    <div id="container" style="width: 100%; height: 100%"></div>

    <script src="vs/loader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
