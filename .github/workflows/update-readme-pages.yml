name: Update README Page Index

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"
      - "tree.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README.md from HTML pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/")

          if repo_name.lower() == f"{owner.lower()}.github.io":
              base_url = f"https://{owner}.github.io"
          else:
              base_url = f"https://{owner}.github.io/{repo_name}"

          ignored_dirs = {
              ".git",
              ".github",
              "node_modules",
              "dist",
              "build",
              ".next",
              ".vercel",
              ".cloudflare",
              "workers",
          }

          html_files = []

          for path in Path(".").rglob("*.html"):
              if any(part in ignored_dirs for part in path.parts):
                  continue
              html_files.append(path)

          html_files = sorted(html_files, key=lambda p: str(p).lower())

          lines = []
          lines.append("# Site Pages")
          lines.append("")
          lines.append("This README is automatically generated from the HTML files in this repository.")
          lines.append("")
          lines.append("## Pages")
          lines.append("")

          if not html_files:
              lines.append("_No HTML pages found._")
          else:
              for path in html_files:
                  rel = path.as_posix()

                  if path.name.lower() == "index.html":
                      folder = path.parent.as_posix()

                      if folder == ".":
                          label = "Home"
                          url = f"{base_url}/"
                      else:
                          label = folder
                          url = f"{base_url}/{folder}/"
                  else:
                      label = rel
                      url = f"{base_url}/{rel}"

                  lines.append(f"- [{label}]({url})")
                  lines.append(f"  - File: `{rel}`")

          lines.append("")
          lines.append("## Updated")
          lines.append("")
          lines.append(f"Last generated: `{datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}`")
          lines.append("")
          lines.append("<!-- generated-by: update-readme-pages -->")
          lines.append("")

          Path("README.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit README.md if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi

          git commit -m "Update README page index [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}